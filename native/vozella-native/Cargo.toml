[package]
name = "vozella-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = [
  "ApplicationModel_Appointments",
  "Foundation_Collections",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
